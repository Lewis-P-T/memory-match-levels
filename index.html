<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Match</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Memory Match</h1>

  <section id="menu-screen">
    <p>Choose a difficulty</p>
    <div class="menu">
      <button data-size="4">Easy <small>4×4</small></button>
      <button data-size="6">Medium <small>6×6</small></button>
      <button data-size="8">Hard <small>8×8</small></button>
    </div>
  </section>

  <section id="game-screen" hidden>
    <div class="hud">
      <span>Time: <b id="time">0:00</b></span>
      <span>Moves: <b id="moves">0</b></span>
      <button id="back-btn">Menu</button>
    </div>
    <div id="board" class="board"></div>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
